<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دوري الحارة</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#4f46e5;--ac2:#7c3aed;--sh:0 2px 10px #0f172a14;box-sizing:border-box;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b2e;--tx:#e8ecf8;--mu:#94a3b8;--bd:#252d45;--sh:0 2px 14px #0006;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--sh)}
header b{font-size:19px}
button,input,select{font:inherit;color:var(--tx);min-height:46px}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;max-width:100%;font-size:16px}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:600}
button:active{opacity:.8}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:#dc2626}
#mb{background:transparent;font-size:26px;padding:0 10px}
#main{padding:12px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.mc{cursor:pointer}.mc:active{opacity:.85}
.sc{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}.sc .n{flex:1}.sc .s{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:6px 12px;border-radius:10px;min-width:64px;text-align:center}
.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 4px;text-align:center;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:13px}td:nth-child(2),th:nth-child(2){text-align:start}
.rl{font-weight:700}.owner{color:#d4a017}.deputy{color:#ea580c}.admin{color:#dc2626}.captain{color:#2563eb}.player{color:#16a34a}
.bd{font-size:11px;border:1px solid currentColor;border-radius:6px;padding:0 5px}
.av{border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-align:center;object-fit:cover;flex:none;display:inline-block;vertical-align:middle}
#cl{height:46vh;min-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
#pn{max-height:130px;overflow-y:auto}
.msg{display:flex;gap:8px;background:var(--bg);border-radius:14px;padding:9px;word-break:break-word}.msg.pin{border:1px solid #f59e0b}
.msg a{cursor:pointer;font-size:13px}.mb{flex:1}
.mn{color:#2563eb;font-weight:700}.mn.me{background:#fde68a;color:#000;border-radius:4px;padding:0 3px}
.in{display:flex;gap:6px}.in input{flex:1}.in select{width:62px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.row input,.row select{flex:1;min-width:110px}
.fl{display:grid;gap:10px;margin-top:8px}label{display:grid;gap:4px;font-size:14px;color:var(--mu)}
.login{max-width:340px;margin:40px auto;display:grid;gap:12px}
h3{margin:14px 0 6px}
#dr{position:fixed;inset:0;background:#0007;display:none;z-index:20}#dr.o{display:block}
#dp{position:absolute;top:0;bottom:0;right:0;width:80%;max-width:320px;background:var(--card);overflow-y:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;color:var(--tx);text-align:start;border-radius:12px;margin:2px 0;font-weight:500}.nv.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.nb{background:#dc2626;color:#fff;border-radius:10px;padding:0 8px;font-size:12px}
.on-u{display:flex;align-items:center;gap:6px;padding:3px 0}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;flex:none}.dot.off{background:#94a3b8}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:12px;right:12px;background:#111;color:#fff;padding:12px;border-radius:12px;z-index:50;text-align:center}
@media(min-width:800px){body{padding-right:300px}#dr{display:block;background:none;pointer-events:none}#dp{pointer-events:auto;width:300px;max-width:300px;border-left:1px solid var(--bd)}#mb{display:none}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pitch{display:block;width:100%;max-width:340px;margin:10px auto;border-radius:12px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:8px 4px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.ev{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--bd);align-items:start}.ev:last-child{border:0}.mn2{text-align:center;color:var(--mu);font-size:13px;padding-top:2px}
.pl{padding:9px 0;border-bottom:1px solid var(--bd)}.pl:last-child{border:0}.plh{display:flex;align-items:center;gap:10px}.plh b{flex:1}.num{background:var(--ac);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-size:12px;flex:none}.plv{padding-inline-start:34px;font-size:13px;color:var(--mu);display:grid;gap:2px;margin-top:4px}
details.acc{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;box-shadow:var(--sh)}details.acc>summary{font-weight:700;padding:14px;cursor:pointer}details.acc>div{padding:0 14px 14px}
details.u{border-bottom:1px solid var(--bd);padding:8px 0}details.u>summary{cursor:pointer}
.ann{background:#fef3c7;color:#78350f;border-radius:14px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}.ann span{flex:1}.ann button{min-height:34px;padding:0 10px;background:#78350f}
.bk{margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RN={owner:'مالك السيرفر',deputy:'مساعد المالك',admin:'أدمن',captain:'كبتن',player:'لاعب'};
const SEC=[['m','المباريات','📅'],['s','الترتيب','🏆'],['p','الهدافين','⚽'],['u','الأعضاء','👥'],['g','الشات العام','💬'],['t','شات الفريق','🛡️']];
const EVI={g:'⚽',y:'🟨',r:'🟥',i:'🩹'};
const FORMS=['1-1-1','2-1','1-2'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let cu=null,tab='m',mid=null,mtab='e',tsel='',peers=[],built='',ws,prev='',menu=false,seen=null,annSeen=null,av='';
let notif=get('lg_nt')==='1'&&'Notification' in window&&Notification.permission==='granted';
const unread={g:0,t:0};
const S={users:[],teams:[],matches:[],g:[],t:[],mutes:{},cfg:{},ann:[]};
const U=i=>S.users.find(u=>u.id===i);
const mgr=()=>cu&&(cu.role==='owner'||cu.role==='deputy');
const staff=()=>cu&&(mgr()||cu.role==='admin');
const tn=i=>(S.teams.find(t=>t.id===i)||{}).name||'—';
const fmt=t=>t?new Date(t).toLocaleString('ar-SA',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const fin=m=>m.fin===true||(m.fin===undefined&&m.hs!=null&&m.as!=null);
const done=fin;
const mm=t=>t!=null?t+"'":'';
const ago=t=>{if(!t)return'لم يدخل بعد';const s=(Date.now()-t)/1000;if(s<60)return'قبل لحظات';const m=s/60;if(m<60)return'قبل '+Math.floor(m)+' دقيقة';const h=m/60;if(h<24)return'قبل '+Math.floor(h)+' ساعة';return'قبل '+Math.floor(h/24)+' يوم'};
const avi=(u,s=32)=>u&&u.av?`<img class="av" style="width:${s}px;height:${s}px" src="/av/${u.id}?v=${u.av}">`:`<span class="av" style="width:${s}px;height:${s}px;line-height:${s}px">${esc((u&&u.name||'?')[0])}</span>`;
const sw=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
const set=(c,i,d)=>sw({a:'set',c,i,d}),upd=(c,i,d)=>sw({a:'upd',c,i,d}),del=(c,i)=>sw({a:'del',c,i});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function sys(t,b){try{if(notif&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}if(navigator.vibrate)navigator.vibrate(120)}
function onlineSet(){const s=new Set(peers.map(p=>(p.presence||{}).uid).filter(Boolean));if(cu)s.add(cu.id);return s}

function init(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{const t=get('lg_tk');t?sw({a:'resume',token:t}):render()};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.a==='token'){put('lg_tk',m.token);return}
    if(m.a==='err'){const el=$('#le');el?el.textContent=m.msg:toast(m.msg);return}
    if(m.a==='ok'){toast(m.msg);return}
    if(m.a==='out'){put('lg_tk',null);cu=null;render();return}
    if(m.a==='state'){
      cu=m.me;S.users=m.users;S.teams=m.teams;S.matches=m.matches;S.g=m.g;S.t=m.t;S.cfg=m.cfg;S.ann=m.ann;
      S.mutes={};m.mutes.forEach(i=>S.mutes[i]=1);peers=m.online.map(u=>({presence:u}));
      notify();
      const k=JSON.stringify([cu.id,cu.name,cu.role,cu.team,cu.av,S.users.map(u=>[u.id,u.name,u.role,u.team,u.av]),S.teams,S.matches,m.mutes,S.cfg,S.ann.map(a=>a.id)]);
      if(k!==prev){prev=k;render()}else{drawer();chatUpdate('g');chatUpdate('t');if(tab==='u'&&!menu&&$('#main'))$('#main').innerHTML=annHtml()+vMembers()}
    }};
  ws.onclose=()=>setTimeout(init,2000);
}
function notify(){
  if(!annSeen)annSeen=new Set(S.ann.map(a=>a.id));
  else S.ann.forEach(a=>{if(!annSeen.has(a.id)){annSeen.add(a.id);if(a.by!==cu.name&&(a.role==='all'||a.role===cu.role)){toast('📢 '+a.text.slice(0,80));sys('رسالة من الإدارة',a.text)}}});
  const all=[...S.g.map(x=>({...x,k:'g'})),...S.t.map(x=>({...x,k:'t'}))];
  if(!seen){seen=new Set(all.map(x=>x.id));return}
  all.forEach(x=>{
    if(seen.has(x.id))return;seen.add(x.id);if(x.u===cu.id)return;
    const men=x.text.toLowerCase().includes('@'+cu.name.toLowerCase());
    const viewing=!document.hidden&&tab===x.k&&!menu;
    if(!viewing)unread[x.k]++;
    if(men&&!viewing){toast('📣 '+x.name+' ذكرك: '+x.text.slice(0,60));sys('منشن من '+x.name,x.text)}
    else if(x.k==='t'&&document.hidden)sys(x.name,x.text);
  });
  document.title=(unread.g+unread.t?'('+(unread.g+unread.t)+') ':'')+'دوري الحارة';
}
function enableNotif(){
  if(!('Notification' in window)){toast('متصفحك ما يدعم الإشعارات');return}
  Notification.requestPermission().then(p=>{notif=p==='granted';put('lg_nt',notif?'1':null);toast(notif?'تم تفعيل الإشعارات':'تم رفض الإذن من المتصفح');drawer()});
}
function login(){sw({a:'login',name:$('#ln').value.trim(),pin:$('#lp').value})}
function logout(){sw({a:'logout',token:get('lg_tk')});put('lg_tk',null);cu=null;prev='';seen=null;annSeen=null;menu=false;render()}
const vis=()=>{const l=SEC.filter(s=>staff()||!(S.cfg[s[0]]||{}).hidden);if(staff())l.push(['a','الإدارة','⚙️']);l.push(['c','حسابي','👤']);return l};
function go(t){tab=t;mid=null;menu=false;if(unread[t]!==undefined)unread[t]=0;document.title='دوري الحارة';render();window.scrollTo(0,0)}
function annHtml(){
  const dis=JSON.parse(get('lg_ad')||'[]'),now=Date.now();
  return S.ann.filter(a=>a.exp>now&&!dis.includes(a.id)&&(a.role==='all'||a.role===cu.role)).map(a=>`<div class="ann"><span>📢 ${esc(a.text)}<br><small>— ${esc(a.by)}</small></span><button onclick="dis('${a.id}')">✕</button></div>`).join('');
}
function dis(i){const d=JSON.parse(get('lg_ad')||'[]');d.push(i);put('lg_ad',JSON.stringify(d.slice(-50)));render()}

function render(){
  built='';
  if(!cu){
    $('#app').innerHTML=`<header><b>⚽ دوري الحارة</b></header><div class="card login"><h3>تسجيل الدخول</h3><input id="ln" placeholder="اسم المستخدم" autocomplete="username"><input id="lp" type="password" placeholder="الرمز السري" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">دخول</button><div id="le" class="mu"></div></div>`;
    return;
  }
  const V=vis();if(!V.find(t=>t[0]===tab))tab=V[0][0];
  $('#app').innerHTML=`<header><button id="mb" onclick="menu=true;render()">☰</button><b>⚽ دوري الحارة</b><span>${avi(cu,34)}</span></header><div id="dr" class="${menu?'o':''}" onclick="if(event.target===this){menu=false;render()}"><div id="dp"></div></div><div id="main"></div>`;
  drawer();
  const views={m:()=>mid?vMatch():vMatches(),s:vTable,p:vScorers,u:vMembers,g:()=>vChat('g'),t:()=>vChat('t'),a:vAdmin,c:vAcct};
  $('#main').innerHTML=annHtml()+views[tab]();
  if(tab==='g'||tab==='t'){built=tab+tsel;chatUpdate(tab)}
}
function drawer(){
  const el=$('#dp');if(!el)return;
  const on=onlineSet(),l=S.users.filter(u=>on.has(u.id));
  el.innerHTML=`<div class="row" style="flex-wrap:nowrap">${avi(cu,44)}<div><b class="rl ${cu.role}">${esc(cu.name)}</b><div class="mu">${RN[cu.role]}</div></div></div>`+
  vis().map(t=>`<button class="nv ${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[2]} ${t[1]}</span>${unread[t[0]]?`<span class="nb">${unread[t[0]]}</span>`:''}</button>`).join('')+
  `<button class="nv" onclick="enableNotif()"><span>🔔 ${notif?'الإشعارات مفعلة':'تفعيل الإشعارات'}</span></button><button class="nv" onclick="logout()"><span>🚪 خروج</span></button><hr style="border-color:var(--bd)"><b>المتصلين — ${l.length}</b>`+
  ['owner','deputy','admin','captain','player'].map(r=>{const x=l.filter(u=>u.role===r);return x.length?`<div class="mu" style="margin-top:8px">${RN[r]} — ${x.length}</div>`+x.map(u=>`<div class="on-u"><span class="dot"></span><span class="rl ${r}">${esc(u.name)}</span></div>`).join(''):''}).join('');
}

/* ===== المباريات ===== */
const rl=m=>m.round==='final'?'🏆 نهائي':m.round==='semi'?'نصف نهائي'+(m.leg==='1'?' (ذهاب)':m.leg==='2'?' (إياب)':''):'';
const agg=m=>{if(m.round!=='semi'||m.leg!=='2'||m.l1h==null||m.l1a==null)return'';const t=done(m)?`<br>المجموع: ${m.hs+m.l1h} - ${m.as+m.l1a}`:'';return`<div class="mu" style="text-align:center">الذهاب: ${m.l1h} - ${m.l1a}${t}</div>`};
const scoreOf=m=>m.hs!=null&&m.as!=null?m.hs+' - '+m.as:'vs';
const statusOf=m=>done(m)?'انتهت':(m.hs!=null?'🔴 جارية':'');
function vMatches(){
  const ms=[...S.matches].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!ms.length)return'<div class="card mu">ما فيه مباريات بعد.</div>';
  return ms.map(m=>`<div class="card mc" onclick="openM('${m.id}')"><div class="mu">${[rl(m),fmt(m.time),statusOf(m)].filter(Boolean).join(' · ')}</div><div class="sc" style="margin-top:6px"><span class="n">${esc(tn(m.home))}</span><span class="s">${scoreOf(m)}</span><span class="n" style="text-align:end">${esc(tn(m.away))}</span></div></div>`).join('');
}
function openM(i){mid=i;mtab='e';render();window.scrollTo(0,0)}
function mySide(m){return cu&&cu.role==='captain'&&cu.team?(cu.team===m.home?'h':cu.team===m.away?'a':''):''}
function vMatch(){
  const m=S.matches.find(x=>x.id===mid);if(!m){mid=null;return vMatches()}
  const T=[['e','📋 الأحداث'],['l','👕 التشكيلة']];if(staff()||mySide(m))T.push(['x','⚙️ تعديل']);
  if(!T.find(t=>t[0]===mtab))mtab='e';
  return`<button class="g bk" onclick="mid=null;render()">→ رجوع للمباريات</button><div class="card"><div class="mu" style="text-align:center">${[rl(m),fmt(m.time),statusOf(m)].filter(Boolean).join(' · ')}</div><div class="sc" style="margin-top:8px"><span class="n">${esc(tn(m.home))}</span><span class="s">${scoreOf(m)}</span><span class="n" style="text-align:end">${esc(tn(m.away))}</span></div>${agg(m)}</div><div class="seg">${T.map(t=>`<button class="${mtab===t[0]?'on':''}" onclick="mtab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`+({e:vEvents,l:vLineup,x:vEdit}[mtab])(m);
}
function evRows(m,types){
  const l=(m.ev||[]).filter(e=>types.includes(e.t)).sort((a,b)=>(a.m??999)-(b.m??999));
  if(!l.length)return'';
  return l.map(e=>{const c=`<div><div>${EVI[e.t]} <b>${esc(e.p)}</b></div>${e.a?`<div class="mu">${esc(e.a)}</div>`:''}</div>`;return`<div class="ev"><div>${e.team==='h'?c:''}</div><div class="mn2">${mm(e.m)}</div><div style="text-align:end">${e.team==='a'?c:''}</div></div>`}).join('');
}
function vEvents(m){
  const S3=[['⚽ الأهداف',['g']],['🟨🟥 الكروت',['y','r']],['🩹 الإصابات',['i']]];
  const o=S3.map(s=>{const r=evRows(m,s[1]);return r?`<div class="card"><h3 style="margin-top:0">${s[0]}</h3>${r}</div>`:''}).join('');
  return o||'<div class="card mu">ما فيه أحداث مسجلة بعد.</div>';
}
function evOf(m,side,name){
  const r={g:[],a:[],y:[],r:[],i:[]},n=(name||'').trim().toLowerCase();if(!n)return r;
  (m.ev||[]).forEach(e=>{if(e.team!==side)return;
    if(e.p.trim().toLowerCase()===n)r[e.t].push(e.m);
    if(e.t==='g'&&e.a&&e.a.trim().toLowerCase()===n)r.a.push(e.m)});
  return r;
}
function pitch(m){
  const hp=(m.hp||'').split('|'),ap=(m.ap||'').split('|');
  if(!(m.hp||'').replace(/\|/g,'').trim()&&!(m.ap||'').replace(/\|/g,'').trim())return'';
  const Y={1:[280],2:[312,248],3:[316,274,232]};
  const dot=(x,y,n,col,nm,ny,side)=>{const s=evOf(m,side,nm);
    return`<circle cx="${x}" cy="${y}" r="13" fill="${col}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" fill="#fff" font-size="12" text-anchor="middle">${n}</text><text x="${x}" y="${ny}" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${esc((nm||'').trim().slice(0,10))}</text>`+
    (s.r.length||s.y.length?`<rect x="${x+9}" y="${y-22}" width="8" height="11" rx="1.5" fill="${s.r.length?'#dc2626':'#facc15'}" stroke="#fff" stroke-width="1"/>`:'')+
    (s.g.length?`<text x="${x+26}" y="${y+4}" fill="#fff" font-size="11" text-anchor="middle">⚽${s.g.length}</text>`:'')+
    (s.a.length?`<text x="${x-26}" y="${y+4}" fill="#fff" font-size="11" text-anchor="middle">🎯${s.a.length}</text>`:'')};
  const team=(f,pl,home,col,side)=>{
    const rows=(f||'1-1-1').split('-').map(Number).filter(n=>n>0),ys=Y[rows.length]||Y[3];
    const gy=home?372:48;let k=1,o=dot(150,gy,1,'#f59e0b',pl[0],gy+26,side);
    rows.forEach((n,r)=>{for(let j=0;j<n;j++){
      const x=300*(j+1)/(n+1),y=home?ys[r]:420-ys[r];k++;
      o+=dot(x,y,k,col,pl[k-1],y+26,side);
    }});return o;
  };
  const ln='stroke="#fff" stroke-opacity=".7" stroke-width="2" fill="none"';
  const cp=t=>`<div class="mu" style="text-align:center">${t}</div>`;
  return`<div class="card">`+cp(esc(tn(m.away))+' · '+esc(m.af||'1-1-1'))+`<svg class="pitch" viewBox="0 0 300 420"><rect width="300" height="420" fill="#15803d"/><rect x="8" y="8" width="284" height="404" ${ln}/><line x1="8" y1="210" x2="292" y2="210" ${ln}/><circle cx="150" cy="210" r="34" ${ln}/><rect x="90" y="8" width="120" height="50" ${ln}/><rect x="90" y="362" width="120" height="50" ${ln}/><rect x="125" y="4" width="50" height="6" fill="#fff"/><rect x="125" y="410" width="50" height="6" fill="#fff"/>${team(m.af,ap,false,'#dc2626','a')}${team(m.hf,hp,true,'#4f46e5','h')}</svg>`+cp(esc(tn(m.home))+' · '+esc(m.hf||'1-1-1'))+`</div>`;
}
function teamList(m,s){
  const team=s==='h'?m.home:m.away,pl=(m[s+'p']||'').split('|').map(x=>x.trim());
  if(!pl.some(Boolean))return`<div class="card"><h3 style="margin-top:0">${esc(tn(team))}</h3><div class="mu">⏳ لسا الكبتن ما سوّى فريقه</div></div>`;
  return`<div class="card"><h3 style="margin-top:0">${esc(tn(team))} · ${esc(m[s+'f']||'1-1-1')}</h3>`+pl.map((n,i)=>{
    if(!n)return'';const e=evOf(m,s,n);
    const L=[...e.y.map(t=>'🟨 '+mm(t)),...e.r.map(t=>'🟥 '+mm(t)),...e.g.map(t=>'⚽ '+mm(t)),...e.a.map(t=>'🎯 '+mm(t)),...e.i.map(t=>'🩹 '+mm(t))];
    return`<div class="pl"><div class="plh"><span class="num">${i+1}</span><b>${esc(n)}${i===0?' 🧤':''}</b><span>⚽ ${e.g.length}</span><span>🎯 ${e.a.length}</span></div>${L.length?`<div class="plv">${L.map(x=>`<div>${x}</div>`).join('')}</div>`:''}</div>`}).join('')+`</div>`;
}
function vLineup(m){return pitch(m)+teamList(m,'h')+teamList(m,'a')}

function lineForm(m,p){
  const f=m[p+'f']||'1-1-1',pl=(m[p+'p']||'').split('|');
  return`<div class="card"><h3 style="margin-top:0">تشكيلة ${esc(tn(p==='h'?m.home:m.away))}</h3><div class="fl"><label>الخطة<select id="lf${p}">${FORMS.map(x=>`<option ${x===f?'selected':''}>${x}</option>`).join('')}</select></label><label>الحارس أولاً ثم 3 لاعبين من الدفاع للهجوم<div class="g2">${[0,1,2,3].map(k=>`<input id="lp${p}${k}" value="${esc(pl[k]||'')}" placeholder="${k===0?'🧤 الحارس':'لاعب '+(k+1)}">`).join('')}</div></label><button onclick="saveLine('${m.id}','${p}')">حفظ التشكيلة</button></div></div>`;
}
function vEdit(m){
  const names=['h','a'].flatMap(x=>(m[x+'p']||'').split('|').map(n=>n.trim()).filter(Boolean));
  let o='';
  if(staff()){
    o+=`<div class="card"><h3 style="margin-top:0">النتيجة والوقت</h3><div class="fl"><label>النتيجة<div class="row"><input id="xs1" type="number" inputmode="numeric" value="${m.hs??''}" placeholder="${esc(tn(m.home))}"><input id="xs2" type="number" inputmode="numeric" value="${m.as??''}" placeholder="${esc(tn(m.away))}"></div></label>${m.round==='semi'&&m.leg==='2'?`<label>نتيجة الذهاب<div class="row"><input id="xl1" type="number" inputmode="numeric" value="${m.l1h??''}" placeholder="${esc(tn(m.home))}"><input id="xl2" type="number" inputmode="numeric" value="${m.l1a??''}" placeholder="${esc(tn(m.away))}"></div></label>`:''}<label>الوقت<input id="xt" type="datetime-local" value="${esc(m.time||'')}"></label><button onclick="saveScore('${m.id}')">حفظ</button><button class="g" onclick="upd('matches','${m.id}',{fin:${!done(m)}})">${done(m)?'↩️ إعادة فتح المباراة':'✅ إنهاء المباراة'}</button>${mgr()?`<button class="r" onclick="if(confirm('حذف المباراة؟')){mid=null;del('matches','${m.id}')}">🗑 حذف المباراة</button>`:''}</div></div>`;
    o+=`<div class="card"><h3 style="margin-top:0">إضافة حدث</h3><datalist id="dlp">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="fl"><select id="et" onchange="$('#ea').style.display=this.value==='g'?'':'none'"><option value="g">⚽ هدف</option><option value="y">🟨 كرت أصفر</option><option value="r">🟥 كرت أحمر</option><option value="i">🩹 إصابة</option></select><select id="etm"><option value="h">${esc(tn(m.home))}</option><option value="a">${esc(tn(m.away))}</option></select><input id="ep" list="dlp" placeholder="اللاعب"><input id="ea" list="dlp" placeholder="الصانع (اختياري)"><input id="em" type="number" inputmode="numeric" placeholder="الدقيقة (اختياري)"><button onclick="addEv('${m.id}')">➕ إضافة</button></div></div>`;
    const ev=(m.ev||[]).slice().sort((a,b)=>(a.m??999)-(b.m??999));
    o+=`<div class="card"><h3 style="margin-top:0">الأحداث المسجلة</h3>${ev.length?ev.map(e=>`<div class="row" style="flex-wrap:nowrap"><span style="flex:1">${EVI[e.t]} <b>${esc(e.p)}</b>${e.a?` <span class="mu">(${esc(e.a)})</span>`:''}<br><span class="mu">${esc(tn(e.team==='h'?m.home:m.away))} ${mm(e.m)}</span></span><button class="r" style="flex:none;min-width:0" onclick="sw({a:'evDel',i:'${m.id}',eid:'${e.id}'})">🗑</button></div>`).join(''):'<span class="mu">لا يوجد</span>'}</div>`;
  }
  const sides=staff()?['h','a']:[mySide(m)];
  return o+sides.filter(Boolean).map(s=>lineForm(m,s)).join('');
}
function saveScore(i){
  const n=x=>$('#'+x)?$('#'+x).value.trim():'',v=x=>n(x)===''?null:+n(x);
  const d={hs:v('xs1'),as:v('xs2'),time:n('xt')};
  if($('#xl1')){d.l1h=v('xl1');d.l1a=v('xl2')}
  upd('matches',i,d);toast('تم الحفظ');
}
function addEv(i){
  const p=$('#ep').value.trim();if(!p){toast('اكتب اسم اللاعب');return}
  const t=$('#et').value;
  sw({a:'evAdd',i,e:{t,team:$('#etm').value,p,a:t==='g'?$('#ea').value.trim():'',m:$('#em').value}});
  $('#ep').value=$('#ea').value=$('#em').value='';toast('تمت الإضافة');
}
function saveLine(i,p){sw({a:'lineup',i,side:p,f:$('#lf'+p).value,p:[0,1,2,3].map(k=>$('#lp'+p+k).value)});toast('تم حفظ التشكيلة')}

/* ===== الترتيب والهدافين ===== */
function vTable(){
  const r={};S.teams.forEach(t=>r[t.id]={n:t.name,p:0,w:0,d:0,l:0,gf:0,ga:0});
  S.matches.filter(done).forEach(m=>{const a=r[m.home],b=r[m.away];if(!a||!b)return;a.p++;b.p++;a.gf+=m.hs;a.ga+=m.as;b.gf+=m.as;b.ga+=m.hs;if(m.hs>m.as){a.w++;b.l++}else if(m.hs<m.as){b.w++;a.l++}else{a.d++;b.d++}});
  const L=Object.values(r).map(x=>({...x,pt:x.w*3+x.d,gd:x.gf-x.ga})).sort((a,b)=>b.pt-a.pt||b.gd-a.gd||b.gf-a.gf);
  if(!L.length)return'<div class="card mu">ما فيه فرق بعد.</div>';
  return`<div class="card" style="overflow-x:auto"><table><tr><th>#</th><th>الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>+/-</th><th>نقاط</th></tr>${L.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gd}</td><td><b>${x.pt}</b></td></tr>`).join('')}</table></div>`;
}
function vScorers(){
  const G={},A={},add=(c,n)=>{n=(n||'').trim();if(n)c[n]=(c[n]||0)+1};
  S.matches.forEach(m=>(m.ev||[]).forEach(e=>{if(e.t==='g'){add(G,e.p);add(A,e.a)}}));
  const tb=(t,c)=>{const l=Object.entries(c).sort((a,b)=>b[1]-a[1]);return`<div class="card"><h3 style="margin-top:0">${t}</h3>${l.length?`<table>${l.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td><b>${x[1]}</b></td></tr>`).join('')}</table>`:'<span class="mu">لا يوجد</span>'}</div>`};
  return tb('⚽ الهدافين',G)+tb('🎯 صناع اللعب',A);
}

/* ===== الأعضاء ===== */
function vMembers(){
  const on=onlineSet(),rk=['owner','deputy','admin','captain','player'];
  const l=[...S.users].sort((a,b)=>(on.has(b.id)-on.has(a.id))||rk.indexOf(a.role)-rk.indexOf(b.role)||(b.seen||0)-(a.seen||0));
  return`<div class="card"><h3 style="margin-top:0">الأعضاء — ${l.length}</h3>${l.map(u=>`<div class="row" style="flex-wrap:nowrap;margin:10px 0">${avi(u,38)}<div style="flex:1"><b class="rl ${u.role}">${esc(u.name)}</b> <span class="bd ${u.role}">${RN[u.role]}</span><div class="mu">${u.team?esc(tn(u.team))+' · ':''}${on.has(u.id)?'<span style="color:#16a34a">🟢 متصل الآن</span>':'⚪ آخر ظهور: '+ago(u.seen)}</div></div></div>`).join('')}</div>`;
}

/* ===== الشات ===== */
function vChat(k){
  let head='';
  if(k==='t'){
    if(cu.role==='owner'){if(!tsel)tsel=(S.teams[0]||{}).id||'';head=`<div class="row"><select onchange="tsel=this.value;render()">${S.teams.map(t=>`<option value="${t.id}" ${t.id===tsel?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`}
    else{tsel=cu.team;if(!tsel)return'<div class="card mu">ما تم تحديد فريق لك بعد.</div>'}
  }
  const lk=!staff()&&(S.cfg[k]||{}).locked,mt=k==='g'&&S.mutes[cu.id];
  const inp=lk?'<div class="mu">🔒 الشات مغلق حالياً.</div>':mt?'<div class="mu">أنت مكتوم من الشات العام.</div>':`<div class="in"><select onchange="ins(this)"><option value="">@</option>${S.users.filter(u=>u.id!==cu.id).map(u=>`<option>${esc(u.name)}</option>`).join('')}</select><input id="ci" enterkeyhint="send" autocomplete="off" placeholder="اكتب رسالتك ثم زر الإرسال بالكيبورد" onkeydown="if(event.key==='Enter')send('${k}')"></div>`;
  return`<div class="card">${head}<div id="pn"></div><div id="cl"></div>${inp}</div>`;
}
function ins(s){if(!s.value)return;const i=$('#ci');if(i){i.value+='@'+s.value+' ';i.focus()}s.value=''}
function msgH(m,k){
  const u=U(m.u)||{id:m.u,name:m.name,role:m.role};
  let t=esc(m.text);
  S.users.slice().sort((a,b)=>b.name.length-a.name.length).forEach(x=>{const w='@'+esc(x.name);if(t.includes(w))t=t.split(w).join(`<span class="mn${x.id===cu.id?' me':''}">${w}</span>`)});
  const cp=k==='g'?mgr():(cu.role==='owner'||(cu.role==='captain'&&cu.team===m.team));
  return`<div class="msg ${m.pin?'pin':''}">${avi(u,36)}<div class="mb"><div><b class="rl ${u.role}">${esc(u.name)}</b> <span class="bd ${u.role}">${RN[u.role]}</span> ${cp?`<a onclick="pin('${k}','${m.id}',${!m.pin})">${m.pin?'📍 إلغاء التثبيت':'📌'}</a>`:''} ${staff()&&k==='g'?`<a onclick="del('gmsg','${m.id}')">🗑</a>`:''}</div><div>${t}</div></div></div>`;
}
function pin(k,i,on){sw({a:'pin',c:k==='g'?'gmsg':'tmsg',i,on})}
function chatUpdate(k){
  if(!cu||!['g','t'].includes(tab)||tab!==k)return;
  if(built!==tab+tsel){render();return}
  const el=$('#cl');if(!el)return;
  const l=k==='g'?S.g:S.t.filter(m=>m.team===tsel);
  $('#pn').innerHTML=l.filter(m=>m.pin).map(m=>msgH(m,k)).join('');
  el.innerHTML=l.map(m=>msgH(m,k)).join('')||'<span class="mu">ابدأ السالفة 👋</span>';
  el.scrollTop=el.scrollHeight;
}
function send(k){
  const i=$('#ci'),t=i.value.trim();if(!t)return;
  const d={text:t.slice(0,500)};if(k==='t')d.team=tsel;
  set(k==='g'?'gmsg':'tmsg',uid(),d);i.value='';
}

/* ===== الإدارة ===== */
function vAdmin(){
  const own=cu.role==='owner',now=Date.now();
  const tO=S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const ro=(own?['deputy','admin','captain','player']:['admin','captain','player']).map(r=>`<option value="${r}">${RN[r]}</option>`).join('');
  const acc=(t,b)=>`<details class="acc"><summary>${t}</summary><div>${b}</div></details>`;
  const RT=[['all','الجميع'],['player','اللاعبين'],['captain','الكبتنية'],['admin','الأدمن'],['deputy','مساعد المالك']];
  const HR=[['1','ساعة'],['6','6 ساعات'],['24','يوم'],['72','3 أيام'],['168','أسبوع']];
  const anns=S.ann.filter(a=>a.exp>now);
  const A=acc('📢 رسالة لجميع الأعضاء',`<div class="fl"><input id="at" placeholder="نص الرسالة" maxlength="300"><label>مدة الرسالة<select id="ah">${HR.map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('')}</select></label><label>تظهر لـ<select id="ar">${RT.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</select></label><button onclick="sendAnn()">إرسال</button></div>${anns.length?'<h3>الرسائل الحالية</h3>'+anns.map(a=>`<div class="row" style="flex-wrap:nowrap"><span style="flex:1">${esc(a.text)}<br><span class="mu">${(RT.find(r=>r[0]===a.role)||[])[1]} · باقي ${Math.max(1,Math.ceil((a.exp-now)/3600000))} ساعة</span></span><button class="r" style="flex:none;min-width:0" onclick="sw({a:'annDel',i:'${a.id}'})">🗑</button></div>`).join(''):''}`);
  const B=acc('🗂 القوائم (إخفاء / إغلاق)',SEC.map(s=>{const c=S.cfg[s[0]]||{},ch=['g','t'].includes(s[0]);return`<div class="row"><b style="flex:1">${s[2]} ${s[1]}</b><button class="g" onclick="sw({a:'cfg',k:'${s[0]}',f:'hidden',v:${!c.hidden}})">${c.hidden?'👁 إظهار':'🙈 إخفاء'}</button>${ch?`<button class="g" onclick="sw({a:'cfg',k:'${s[0]}',f:'locked',v:${!c.locked}})">${c.locked?'🔓 فتح':'🔒 إغلاق'}</button>`:''}</div>`}).join(''));
  const C=acc('🛡️ الفرق',S.teams.map(t=>`<div class="row"><b style="flex:1">${esc(t.name)}</b>${mgr()?`<button class="r" onclick="if(confirm('حذف الفريق ${esc(t.name)} مع مبارياته وشات الفريق؟'))del('teams','${t.id}')">حذف</button>`:''}</div>`).join('')+`<div class="row"><input id="tnm" placeholder="اسم الفريق الجديد"><button onclick="addT()">إضافة</button></div>`);
  const D=acc('📅 مباراة جديدة',`<div class="fl"><select id="mh">${tO}</select><select id="ma">${tO}</select><select id="mr" onchange="togLeg()"><option value="semi">نصف نهائي</option><option value="final">نهائي</option></select><select id="ml"><option value="1">ذهاب</option><option value="2">إياب</option></select><input id="mt" type="datetime-local"><button onclick="addM()">إضافة المباراة</button></div><div class="mu" style="margin-top:8px">الأهداف والكروت والتشكيلة تضيفها من داخل المباراة ← ⚙️ تعديل</div>`);
  if(!mgr())return A+B+C+D;
  const on=onlineSet();
  const E=acc('➕ إضافة يوزر',`<div class="fl"><input id="un" placeholder="الاسم"><input id="up" placeholder="الرمز السري"><select id="ur">${ro}</select><select id="ut"><option value="">بدون فريق</option>${tO}</select><button onclick="addU()">إضافة</button></div>`);
  const F=acc('👤 اليوزرات',S.users.map(u=>`<details class="u"><summary><b class="rl ${u.role}">${esc(u.name)}</b> <span class="mu">${RN[u.role]} · ${on.has(u.id)?'🟢 متصل':'آخر ظهور '+ago(u.seen)}</span></summary>${u.role==='owner'?'':`<div class="row">${own?`<select onchange="upd('users','${u.id}',{role:this.value})">${['deputy','admin','captain','player'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${RN[r]}</option>`).join('')}</select><select onchange="upd('users','${u.id}',{team:this.value})"><option value="">بدون فريق</option>${S.teams.map(t=>`<option value="${t.id}" ${u.team===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:''}<button class="g" onclick="mute('${u.id}')">${S.mutes[u.id]?'فك الميوت':'ميوت'}</button>${own?`<button class="g" onclick="askPin('${u.id}','${esc(u.name)}')">🔑 تغيير الرمز</button><button class="r" onclick="if(confirm('حذف اليوزر؟'))del('users','${u.id}')">حذف</button>`:''}</div>`}</details>`).join(''));
  return A+B+C+D+E+F;
}
function sendAnn(){const t=$('#at').value.trim();if(!t){toast('اكتب نص الرسالة');return}sw({a:'ann',text:t,role:$('#ar').value,hrs:+$('#ah').value});$('#at').value='';toast('تم إرسال الرسالة')}
function askPin(i,n){const p=prompt('الرمز السري الجديد لـ '+n);if(p===null)return;if(p.length<3){toast('الرمز قصير');return}sw({a:'setpin',i,pin:p})}
function togLeg(){$('#ml').style.display=$('#mr').value==='semi'?'':'none'}
function addT(){const n=$('#tnm').value.trim();if(n)set('teams',uid(),{name:n})}
function addM(){const h=$('#mh').value,a=$('#ma').value;if(!h||!a||h===a){toast('اختر فريقين مختلفين');return}set('matches',uid(),{home:h,away:a,time:$('#mt').value,round:$('#mr').value,leg:$('#mr').value==='semi'?$('#ml').value:'',hs:null,as:null,fin:false});toast('تمت الإضافة')}
function addU(){const n=$('#un').value.trim(),p=$('#up').value;if(!n||!p)return;set('users',uid(),{name:n,pin:p,role:$('#ur').value,team:$('#ut').value});$('#un').value='';$('#up').value='';toast('تمت إضافة اليوزر')}
function mute(i){S.mutes[i]?del('mutes',i):set('mutes',i,{on:true})}

/* ===== حسابي ===== */
function vAcct(){
  return`<div class="card"><h3 style="margin-top:0">حسابي</h3><div class="fl"><div style="text-align:center"><div id="avp">${avi(cu,90)}</div><label style="margin-top:8px">الصورة<input type="file" accept="image/*" onchange="pickAv(this.files[0])"></label></div><label>الاسم<input id="an" value="${esc(cu.name)}"></label><button onclick="sw({a:'profile',name:$('#an').value,avatar:av})">حفظ الاسم والصورة</button></div></div>
<div class="card"><h3 style="margin-top:0">تغيير الرمز السري</h3><div class="fl"><input id="p0" type="password" placeholder="الرمز الحالي"><input id="p1" type="password" placeholder="الرمز الجديد"><input id="p2" type="password" placeholder="أعد كتابة الرمز الجديد"><button onclick="chPass()">تغيير الرمز</button></div></div>`;
}
function pickAv(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);av=c.toDataURL('image/jpeg',.7);$('#avp').innerHTML=`<img class="av" style="width:90px;height:90px" src="${av}">`};im.src=r.result};
  r.readAsDataURL(f);
}
function chPass(){
  const o=$('#p0').value,n=$('#p1').value,c=$('#p2').value;
  if(n!==c){toast('الرمز الجديد غير متطابق');return}
  if(n.length<3){toast('الرمز قصير');return}
  sw({a:'pass',old:o,nw:n});$('#p0').value=$('#p1').value=$('#p2').value='';
}
init();
</script>
