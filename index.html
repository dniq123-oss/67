<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دوري الحارة</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#14181f;--mu:#6b7380;--bd:#e1e5ec;--ac:#16a34a;--ow:#d4a017;--ad:#dc2626;--pl:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#1a1f29;--tx:#eef1f6;--mu:#8d96a5;--bd:#2a3140;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px}
header{background:var(--ac);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:18px}
button,input,select{font:inherit;color:var(--tx)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:var(--ad)}
.wrap{display:grid;gap:12px;padding:12px;max-width:1100px;margin:auto}
@media(min-width:800px){.wrap{grid-template-columns:230px 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.m{border-bottom:1px solid var(--bd);padding:10px 0}.m:last-child{border:0}
.sc{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}.sc .n{flex:1}.sc .s{background:var(--bg);padding:4px 12px;border-radius:8px;min-width:64px;text-align:center}
.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--bd)}td:nth-child(2),th:nth-child(2){text-align:start}
.on-u{display:flex;align-items:center;gap:6px;padding:4px 0}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;flex:none}
.rl{font-size:12px;font-weight:700}.owner{color:var(--ow)}.admin{color:var(--ad)}.player{color:var(--pl)}
#cl{height:50vh;min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{background:var(--bg);border-radius:10px;padding:6px 10px;word-break:break-word}
.in{display:flex;gap:6px}.in input{flex:1}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.login{max-width:340px;margin:40px auto;display:grid;gap:10px}
h3{margin:12px 0 6px}
</style>
</head>
<body>
<header><b>⚽ دوري الحارة</b><span id="who"></span></header>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RN={owner:'مالك السيرفر',admin:'أدمن',player:'لاعب'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let cu=null,tab='m',tsel='',peers=[],built='',ws,prev='';
const S={users:[],teams:[],matches:[],g:[],t:[],mutes:{}};
const tn=i=>(S.teams.find(t=>t.id===i)||{}).name||'—';
const staff=()=>cu&&(cu.role==='owner'||cu.role==='admin');
const fmt=t=>t?new Date(t).toLocaleString('ar-SA',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const done=m=>m.hs!=null&&m.hs!==''&&m.as!=null&&m.as!=='';
const sw=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
const db={collection:c=>({doc:i=>({set:d=>sw({a:'set',c,i,d}),update:d=>sw({a:'upd',c,i,d}),delete:()=>sw({a:'del',c,i})})})};
function init(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{const t=get('lg_tk');t?sw({a:'resume',token:t}):render()};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.a==='token'){put('lg_tk',m.token);return}
    if(m.a==='err'){const el=$('#le');if(el)el.textContent=m.msg;return}
    if(m.a==='out'){put('lg_tk',null);cu=null;render();return}
    if(m.a==='state'){
      cu=m.me;S.users=m.users;S.teams=m.teams;S.matches=m.matches;S.g=m.g;S.t=m.t;
      S.mutes={};m.mutes.forEach(i=>S.mutes[i]=1);peers=m.online.map(u=>({presence:u}));
      const k=JSON.stringify([cu,S.users,S.teams,S.matches,m.mutes]);
      if(k!==prev){prev=k;render()}else{onlineUpdate();chatUpdate('g');chatUpdate('t')}
    }};
  ws.onclose=()=>setTimeout(init,2000);
}
function login(){sw({a:'login',name:$('#ln').value.trim(),pin:$('#lp').value})}
function logout(){sw({a:'logout',token:get('lg_tk')});put('lg_tk',null);cu=null;prev='';render()}
function render(){
  built='';
  $('#who').innerHTML=cu?`<span>${esc(cu.name)} · ${RN[cu.role]} <button class="g" style="color:#fff;border-color:#fff8" onclick="logout()">خروج</button></span>`:'';
  if(!cu){
    $('#app').innerHTML=`<div class="card login"><h3>تسجيل الدخول</h3><input id="ln" placeholder="اسم المستخدم"><input id="lp" type="password" placeholder="الرمز السري" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">دخول</button><div id="le" class="mu"></div></div>`;
    return;
  }
  const T=[['m','المباريات'],['s','الترتيب'],['p','الهدافين'],['g','الشات العام'],['t','شات الفريق']];
  if(staff())T.push(['a','الإدارة']);
  $('#app').innerHTML=`<div class="wrap"><aside class="card" id="on"></aside><main><div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div><div id="main"></div></main></div>`;
  onlineUpdate();
  const v={m:vMatches,s:vTable,p:vScorers,g:()=>vChat('g'),t:()=>vChat('t'),a:vAdmin}[tab];
  $('#main').innerHTML=v();
  if(tab==='g'||tab==='t'){built=tab+tsel;chatUpdate(tab)}
}
function onlineUpdate(){
  const el=$('#on');if(!el)return;
  const m=new Map();
  peers.forEach(p=>{const d=p.presence||{};if(d.uid&&!m.has(d.uid))m.set(d.uid,d)});
  if(cu)m.set(cu.id,{uid:cu.id,name:cu.name,role:cu.role});
  const l=[...m.values()];
  el.innerHTML=`<b>المتصلين — ${l.length}</b>`+['owner','admin','player'].map(r=>{const x=l.filter(u=>u.role===r);return x.length?`<div class="mu" style="margin-top:8px">${RN[r]} — ${x.length}</div>`+x.map(u=>`<div class="on-u"><span class="dot"></span><span class="rl ${r}">${esc(u.name)}</span></div>`).join(''):''}).join('');
}

function vMatches(){
  const ms=[...S.matches].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!ms.length)return'<div class="card mu">ما فيه مباريات بعد.</div>';
  return'<div class="card">'+ms.map(m=>`<div class="m"><div class="mu">${m.round==='final'?'🏆 نهائي · ':m.round==='semi'?'نصف نهائي'+(m.leg==='1'?' (ذهاب)':m.leg==='2'?' (إياب)':'')+' · ':''}${fmt(m.time)} ${done(m)?'· انتهت':''}</div><div class="sc"><span class="n">${esc(tn(m.home))}</span><span class="s">${done(m)?m.hs+' - '+m.as:'vs'}</span><span class="n" style="text-align:end">${esc(tn(m.away))}</span></div>${m.scorers?`<div class="mu">⚽ ${esc(m.scorers)}</div>`:''}${m.assists?`<div class="mu">🎯 ${esc(m.assists)}</div>`:''}${staff()?editRow(m):''}</div>`).join('')+'</div>';
}
function editRow(m){return`<div class="row"><input id="h${m.id}" type="number" style="width:60px" value="${m.hs??''}" placeholder="هدف"><input id="a${m.id}" type="number" style="width:60px" value="${m.as??''}" placeholder="هدف"><input id="t${m.id}" type="datetime-local" value="${esc(m.time||'')}"><input id="sc${m.id}" value="${esc(m.scorers||'')}" placeholder="المسجلين (فاصلة)"><input id="as${m.id}" value="${esc(m.assists||'')}" placeholder="الصانعين (فاصلة)"><button onclick="saveM('${m.id}')">حفظ</button>${cu.role==='owner'?`<button class="r" onclick="db.collection('matches').doc('${m.id}').delete()">حذف</button>`:''}</div>`}
function saveM(i){const n=x=>$('#'+x+i).value;db.collection('matches').doc(i).update({hs:n('h')===''?null:+n('h'),as:n('a')===''?null:+n('a'),time:n('t'),scorers:n('sc'),assists:n('as')})}

function vTable(){
  const r={};S.teams.forEach(t=>r[t.id]={n:t.name,p:0,w:0,d:0,l:0,gf:0,ga:0});
  S.matches.filter(done).forEach(m=>{const a=r[m.home],b=r[m.away];if(!a||!b)return;a.p++;b.p++;a.gf+=m.hs;a.ga+=m.as;b.gf+=m.as;b.ga+=m.hs;if(m.hs>m.as){a.w++;b.l++}else if(m.hs<m.as){b.w++;a.l++}else{a.d++;b.d++}});
  const L=Object.values(r).map(x=>({...x,pt:x.w*3+x.d,gd:x.gf-x.ga})).sort((a,b)=>b.pt-a.pt||b.gd-a.gd||b.gf-a.gf);
  if(!L.length)return'<div class="card mu">ما فيه فرق بعد.</div>';
  return`<div class="card" style="overflow-x:auto"><table><tr><th>#</th><th>الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>+/-</th><th>نقاط</th></tr>${L.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gd}</td><td><b>${x.pt}</b></td></tr>`).join('')}</table></div>`;
}
function vScorers(){
  const cnt=k=>{const c={};S.matches.forEach(m=>(m[k]||'').split(/[,،]/).map(s=>s.trim()).filter(Boolean).forEach(n=>c[n]=(c[n]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1])};
  const tb=(t,l)=>`<div class="card"><h3 style="margin-top:0">${t}</h3>${l.length?`<table>${l.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td><b>${x[1]}</b></td></tr>`).join('')}</table>`:'<span class="mu">لا يوجد</span>'}</div>`;
  return'<div style="display:grid;gap:10px">'+tb('⚽ الهدافين',cnt('scorers'))+tb('🎯 صناع اللعب',cnt('assists'))+'</div>';
}

function chatKey(k){return k==='g'?'g':'t'}
function vChat(k){
  let head='';
  if(k==='t'){
    if(cu.role==='owner'){if(!tsel)tsel=(S.teams[0]||{}).id||'';head=`<div class="row"><select id="ts" onchange="tsel=this.value;render()">${S.teams.map(t=>`<option value="${t.id}" ${t.id===tsel?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`}
    else{tsel=cu.team;if(!tsel)return'<div class="card mu">ما تم تحديد فريق لك بعد.</div>'}
  }
  const muted=k==='g'&&S.mutes[cu.id];
  return`<div class="card">${head}<div id="cl"></div>${muted?'<div class="mu">أنت مكتوم من الشات العام.</div>':'<div class="in"><input id="ci" placeholder="اكتب رسالتك..." onkeydown="if(event.key===\'Enter\')send(\''+k+'\')"><button onclick="send(\''+k+'\')">إرسال</button></div>'}</div>`;
}
function chatUpdate(k){
  if(!cu||!['g','t'].includes(tab)||tab!==k)return;
  if(built!==tab+tsel){render();return}
  const el=$('#cl');if(!el)return;
  const l=k==='g'?S.g:S.t.filter(m=>m.team===tsel);
  el.innerHTML=l.map(m=>`<div class="msg"><span class="rl ${m.role}">${esc(m.name)}</span>${staff()&&k==='g'?` <a href="#" class="mu" onclick="del('gmsg','${m.id}');return false">حذف</a>`:''}<div>${esc(m.text)}</div></div>`).join('')||'<span class="mu">ابدأ السالفة 👋</span>';
  el.scrollTop=el.scrollHeight;
}
function send(k){
  const i=$('#ci'),t=i.value.trim();if(!t)return;
  if(k==='g'&&S.mutes[cu.id])return;
  const d={name:cu.name,role:cu.role,u:cu.id,text:t.slice(0,500),ts:Date.now()};
  if(k==='t')d.team=tsel;
  db.collection(k==='g'?'gmsg':'tmsg').doc(uid()).set(d);i.value='';
}
function del(c,i){db.collection(c).doc(i).delete()}

function vAdmin(){
  const own=cu.role==='owner',tO=S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  return`<div class="card"><h3 style="margin-top:0">فريق جديد</h3><div class="row"><input id="tnm" placeholder="اسم الفريق"><button onclick="addT()">إضافة</button></div>
<h3>مباراة جديدة</h3><div class="row"><select id="mh">${tO}</select><span>ضد</span><select id="ma">${tO}</select><select id="mr" onchange="togLeg()"><option value="semi">نصف نهائي</option><option value="final">نهائي</option></select><select id="ml"><option value="1">ذهاب</option><option value="2">إياب</option></select><input id="mt" type="datetime-local"><button onclick="addM()">إضافة</button></div>
${own?`<h3>إضافة يوزر</h3><div class="row"><input id="un" placeholder="الاسم"><input id="up" placeholder="الرمز السري"><select id="ur"><option value="player">لاعب</option><option value="admin">أدمن</option></select><select id="ut"><option value="">بدون فريق</option>${tO}</select><button onclick="addU()">إضافة</button></div>
<h3>اليوزرات</h3>${S.users.map(u=>`<div class="row"><b class="${u.role}">${esc(u.name)}</b><span class="mu">${tn(u.team)}</span>${u.role!=='owner'?`<select onchange="db.collection('users').doc('${u.id}').update({role:this.value})"><option value="player" ${u.role==='player'?'selected':''}>لاعب</option><option value="admin" ${u.role==='admin'?'selected':''}>أدمن</option></select><select onchange="db.collection('users').doc('${u.id}').update({team:this.value})"><option value="">بدون فريق</option>${S.teams.map(t=>`<option value="${t.id}" ${u.team===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><button class="g" onclick="mute('${u.id}')">${S.mutes[u.id]?'فك الميوت':'ميوت'}</button><button class="r" onclick="del('users','${u.id}')">حذف</button>`:''}</div>`).join('')}`:''}</div>`;
}
function togLeg(){$('#ml').style.display=$('#mr').value==='semi'?'':'none'}
function addT(){const n=$('#tnm').value.trim();if(n)db.collection('teams').doc(uid()).set({name:n})}
function addM(){const h=$('#mh').value,a=$('#ma').value;if(!h||!a||h===a)return;db.collection('matches').doc(uid()).set({home:h,away:a,time:$('#mt').value,round:$('#mr').value,leg:$('#mr').value==='semi'?$('#ml').value:'',hs:null,as:null,scorers:'',assists:''})}
async function addU(){const n=$('#un').value.trim(),p=$('#up').value;if(!n||!p)return;await db.collection('users').doc(uid()).set({name:n,pin:p,role:$('#ur').value,team:$('#ut').value})}
function mute(i){S.mutes[i]?db.collection('mutes').doc(i).delete():db.collection('mutes').doc(i).set({on:true})}
init();
</script>
</body>
</html>
